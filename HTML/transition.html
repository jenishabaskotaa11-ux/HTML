<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: orange;
            transition: background-color 2s steps (4,jump-end) 0s;


                /* syntax:
            transition: property duration timing-function delay;
            
            property: height , width, border
            duration:1s, 2s
            timing-function: ease, ease-in, linear
            delay: 1s 2s 4s
            */
        }
        .box:hover{
            background-color: blue;
        }
        .box1{
            background-color: brown;
            height:300px;
            width:300px;
            transition:all 2s ease-in-out 0.5s;
        }
        .box1:hover{
            width:350px;
            height:350px;
            background-color: purple;
            border:1px solid gray;
            box-shadow:0px 0px 2px black;
        }
    </style>
</head>

<body>
    <h1>Transition in CSS</h1>
    <div class="box">

    </div>
    <!-- multiple transition -->
     <div class="box1">

     </div>
</body>

</html>
