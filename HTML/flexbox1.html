<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/flexbox1.css">
</head>

<body>
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>
    <h1>Flexbox Day 2</h1>

    <h2>Flex Wrap</h2>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
    </div>

    <h2>Order</h2>
    <div class="container">
        <div class="item" style="order:3">1</div>
        <div class="item" style="order:2">2</div>
        <div class="item" style="order:4">3</div>
        <div class="item" style="order:1">4</div>
    </div>

    <h2>Align Shelf</h2>
    <div class="container">
        <div class="item">1</div>
        <div class="item" id="shelf-second">2</div>
        <div class="item" id="shelf-third">3</div>
        <div class="item">4</div>
    </div>

</body>

</html>
