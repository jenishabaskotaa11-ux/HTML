<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: yellow;
        }

        #box2 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: yellow;
            padding: 50px;
        }

        #box3 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: yellow;
            padding: 50px 40px;
        }

        #box4 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: yellow;
            padding: 50px 40px 30px 20px;
        }

        #box5 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: yellow;
            margin: 50px;
        }

        #box6 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: yellow;
            margin: 80px 40px;
        }

        #box7 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: yellow;
            margin: 150px 50px 100px 200px;
        }
    </style>
</head>

<body>
    <h1>Box Model</h1>

    <p id="box">
        Bikul Raj Koirala
    </p>

    <p id="box2">
        Bikul Raj Koirala
    </p>

    <!-- 
    padding: it is the space between the elements and its border.
    syntax:
    padding: allsides;
    padding: top-bottom left-right;
    padding: top right bottom left;
     -->

    <p id="box3">
        Marker
    </p>

    <p id="box4">
        Bikul Sir's marker
    </p>

    <h1>Margin</h1>

    <!-- 
    margin- it is the space outside the border of the element. margin sets the space between elements.
    syntax:
    margin: all sides;
    margin: top-bottom left-right;
    margin: top right bottom left;
     -->
    <p id="box5">
        Cholocate cake
    </p>

    <p id="box6">
        Red Velvet
    </p>

    <p id="box7">
        Black Forest
    </p>

    <!-- every element box ko form maa baseko hunxa. element ko height and width hunxa. element and border ko bich maa padding hunxa ra border baira ko space is margin. duita element xuttyaune is margin ko space. -->
</body>

</html>
